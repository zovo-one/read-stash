<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Stash</title>
  <link rel="stylesheet" href="reads7984-base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="root">
    <!-- Header -->
    <header class="popup-header">
      <h1 class="popup-header__title">__MSG_popupTitle__</h1>
      <span id="tier-badge" class="popup-header__badge reads7984-badge">__MSG_badgeFree__</span>
      <a id="settings-link" class="popup-header__gear" href="#" role="button" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </header>

    <!-- Save button -->
    <button id="save-btn" class="popup-save reads7984-btn reads7984-btn--primary" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="popup-save__label">__MSG_saveThisPage__</span>
    </button>

    <!-- Search -->
    <input id="search-input" class="popup-search reads7984-input" type="search"
           placeholder="__MSG_searchPlaceholder__" autocomplete="off" aria-label="Search your stash">

    <!-- Article list (rendered by popup.ts) -->
    <div id="article-list" class="popup-list" role="list"></div>

    <!-- Empty state (shown by popup.ts when library is empty) -->
    <div id="empty-state" class="popup-empty" hidden>
      <p class="popup-empty__title">__MSG_emptyLibraryTitle__</p>
      <p class="popup-empty__body">__MSG_emptyLibraryBody__</p>
    </div>

    <!-- Empty search state -->
    <div id="empty-search" class="popup-empty popup-empty--search" hidden>
      <p class="popup-empty__title">__MSG_emptySearchTitle__</p>
      <p class="popup-empty__body">__MSG_emptySearchBody__</p>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <a id="open-library" class="popup-footer__link" href="#">
        __MSG_openFullLibrary__
      </a>
      <button id="theme-toggle" class="popup-footer__theme reads7984-btn reads7984-btn--ghost" type="button" aria-label="Toggle theme">
        <svg id="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
<script src="zovo150k.js" defer></script>
</body>
</html>
